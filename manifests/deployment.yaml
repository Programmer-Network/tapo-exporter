apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapo-exporter
  namespace: monitoring
  labels:
    app: tapo-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tapo-exporter
  template:
    metadata:
      labels:
        app: tapo-exporter
    spec:
      # The Tapo plug VLAN (192.168.10.x) is firewalled to only allow the lenovo
      # host (192.168.20.106). Pinning here makes the pod's egress SNAT to lenovo's
      # IP, so it can reach the plugs without any firewall change. Other nodes/pods
      # cannot reach the plugs.
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-lenovo.cluster
      # The org disallows public packages, so the image stays private on ghcr.
      # This secret holds a GitHub token with read:packages (created out-of-band /
      # via Vault — not committed).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: exporter
          image: ghcr.io/programmer-network/tapo-exporter:latest
          ports:
            - name: metrics
              containerPort: 9801
          env:
            # Friendly plug names (was head/worker/pis) -> the device each plug powers.
            - name: TAPO_PLUGS
              value: "k3s Cluster=192.168.10.215,ASUS Ascent GX10=192.168.10.216,DGX Spark=192.168.10.217"
            - name: KASA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tapo-credentials
                  key: username
            - name: KASA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tapo-credentials
                  key: password
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
