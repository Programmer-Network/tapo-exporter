# Renders the ghcr-pull image-pull secret from Vault (kv-v2/ghcr).
# The org disallows public packages, so the private image needs a pull secret.
# Populate Vault first:
#   vault kv put secret/monitoring/ghcr username=<github-user> token=<PAT-with-read:packages>
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: monitoring
spec:
  vaultAuthRef: monitoring-vault-auth
  mount: secret
  path: monitoring/ghcr
  type: kv-v2
  refreshAfter: 1h
  destination:
    name: ghcr-pull
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      # Drop the raw username/token keys; emit only the templated dockerconfigjson.
      excludes:
        - ".*"
      templates:
        ".dockerconfigjson":
          text: |
            {"auths":{"ghcr.io":{"username":"{{ .Secrets.username }}","password":"{{ .Secrets.token }}","auth":"{{ printf "%s:%s" .Secrets.username .Secrets.token | b64enc }}"}}}
