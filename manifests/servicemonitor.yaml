apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tapo-exporter
  namespace: monitoring
  labels:
    app: tapo-exporter
    # REQUIRED: this cluster's Prometheus uses serviceMonitorSelector
    # matchLabels {release: kube-prometheus-stack}. Without it, this SM is
    # invisible to Prometheus and the exporter is never scraped.
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 15s
      scrapeTimeout: 10s
      port: metrics
      path: /metrics
  selector:
    matchLabels:
      app: tapo-exporter
