name: Build and Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr/OCI reference names must be lowercase; ${{ github.repository }} is
  # "Programmer-Network/tapo-exporter" (mixed case) and was failing the build.
  IMAGE_NAME: programmer-network/tapo-exporter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
